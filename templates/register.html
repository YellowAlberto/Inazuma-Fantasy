{% extends "base.html" %}
{% block title %}Crear cuenta · Inazuma Fantasy{% endblock %}
{% block content %}
<div class="auth-page">
  <form class="card auth-card" method="post">
    <h1>⚡ Inazuma Fantasy</h1>
    <p class="auth-subtitle">Crea tu cuenta de entrenador.</p>
    <label>Usuario</label>
    <input name="username" placeholder="Mín. 3 caracteres" required autofocus>
    <label>Contraseña</label>
    <input type="password" name="password" placeholder="Mín. 4 caracteres" required>
    <button class="btn btn-primary btn-block" type="submit">Crear cuenta</button>
    <p class="auth-switch">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p>
  </form>
</div>
{% endblock %}
